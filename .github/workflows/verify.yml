name: Verify build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  handover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source-only archive boundaries
        run: python -B -m unittest discover -s tests -p 'test_package_handover.py' -v
      - name: Package and verify committed source
        run: |
          python -B scripts/package-handover.py --output-dir "$RUNNER_TEMP/handover"
          python -B scripts/package-handover.py --verify "$RUNNER_TEMP"/handover/*.zip

  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
      - name: Identify immutable application source
        id: source
        run: echo "tree=$(git rev-parse HEAD:shendu)" >> "$GITHUB_OUTPUT"
      - name: Verify isolated installation scenarios
        run: |
          sh -n install.sh
          sh -n shendu/scripts/install.sh
          sh -n shendu/scripts/update.sh
          sh -n shendu/scripts/prepare-image.sh
          sh -n shendu/scripts/site-backup.sh
          sh -n shendu/scripts/docker-entrypoint.sh
          sh -n shendu/tests/install-script.test.sh
          sh shendu/tests/install-script.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: shendu/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: shendu
        run: npm ci --no-audit --no-fund
      - name: Check scripts and tests
        working-directory: shendu
        run: |
          npm run check
          npm test
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        working-directory: shendu
        run: |
          cp .env.example .env
          sed -i "s/replace_with_64_hex_characters/$(openssl rand -hex 32)/" .env
          docker compose config >/dev/null
          docker compose config --format json | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { services } = JSON.parse(readFileSync(0, "utf8"));
            if (Object.keys(services.caddy.environment).some(key => key !== "SHENDU_DOMAIN")) throw new Error("Caddy must receive only its domain, never application secrets");
            if (services.shendu.environment.SHENDU_TRUST_PROXY !== "true") throw new Error("Private Compose upstream must explicitly trust Caddy");
            if (services.shendu.build || services.shendu.pull_policy !== "never") throw new Error("Default server deployment must use a prepared image without building");
          '
      - name: Build cached native image
        uses: docker/build-push-action@v6
        with:
          context: shendu
          load: true
          tags: shendu-deploy:${{ steps.source.outputs.tree }}-${{ matrix.arch }}
          build-args: SHENDU_SOURCE_TREE=${{ steps.source.outputs.tree }}
          cache-from: type=gha,scope=shendu-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=shendu-${{ matrix.arch }}
      - name: Start image and check health
        env:
          IMAGE: shendu-deploy:${{ steps.source.outputs.tree }}-${{ matrix.arch }}
        run: |
          docker run -d --name shendu-ci -p 127.0.0.1:43127:3000 "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43127/healthz; then
              node shendu/scripts/smoke-ui.mjs http://127.0.0.1:43127
              exit $?
            fi
            sleep 1
          done
          docker logs shendu-ci
          exit 1
      - name: Package verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: shendu-deploy:${{ steps.source.outputs.tree }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p deploy-images
          docker save "$IMAGE" | gzip -1 > "deploy-images/shendu-linux-$ARCH.tar.gz"
          cd deploy-images
          sha256sum "shendu-linux-$ARCH.tar.gz" > "shendu-linux-$ARCH.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: deploy-images-${{ matrix.arch }}
          path: deploy-images/*
          compression-level: 0
          retention-days: 1
      - name: Clean up smoke container
        if: always()
        run: docker rm -f shendu-ci || true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: deploy-${{ needs.verify.outputs.tree }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deploy-images-*
          path: deploy-images
          merge-multiple: true
      - name: Publish immutable public deployment assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TREE: ${{ needs.verify.outputs.tree }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="deploy-$TREE"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$COMMIT" --title "Deployment $TREE" --notes 'Verified Linux amd64/arm64 images. Deployment scripts verify SHA-256 and source identity before use.' --latest=false
          fi
          existing=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for asset in deploy-images/*; do
            name=$(basename "$asset")
            if ! printf '%s\n' "$existing" | grep -Fx "$name" >/dev/null; then
              gh release upload "$tag" "$asset"
            fi
          done

  download-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Download publicly, verify, load and reuse the deployment image
        working-directory: shendu
        env:
          IMAGE: shendu-deploy:${{ needs.verify.outputs.tree }}-${{ matrix.arch }}
        run: |
          # No token or registry login is supplied to this real deployment path.
          set -euo pipefail
          umask 077
          cp .env.example .env
          sed -i "s/replace_with_64_hex_characters/$(openssl rand -hex 32)/" .env
          sudo sh scripts/prepare-image.sh
          sudo sh scripts/prepare-image.sh | tee /tmp/shendu-image-reuse.log
          grep -F '复用本机已验证镜像' /tmp/shendu-image-reuse.log
          selected=$(sudo docker compose config --format json | node --input-type=module -e 'import {readFileSync} from "node:fs";console.log(JSON.parse(readFileSync(0,"utf8")).services.shendu.image)')
          test "$selected" = "$IMAGE"
          sudo docker compose up -d --no-deps --wait --wait-timeout 90 shendu
          sudo docker compose exec -T shendu node scripts/smoke-ui.mjs http://127.0.0.1:3000
          snapshot=$(sudo sh scripts/site-backup.sh | tail -n 1)
          sudo test -s "$snapshot"
          echo 'Public download, local reuse, real Compose health/UI and encrypted snapshot passed.'
      - name: Clean up downloaded image container
        if: always()
        run: docker rm -f shendu || true
