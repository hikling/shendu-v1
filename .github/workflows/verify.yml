name: Verify build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated installation scenarios
        run: |
          sh -n install.sh
          sh -n shendu/scripts/install.sh
          sh -n shendu/scripts/update.sh
          sh -n shendu/scripts/site-backup.sh
          sh -n shendu/scripts/docker-entrypoint.sh
          sh -n shendu/tests/install-script.test.sh
          sh shendu/tests/install-script.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: shendu/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: shendu
        run: npm ci
      - name: Check scripts and tests
        working-directory: shendu
        run: |
          npm run check
          npm test
      - name: Validate Compose configuration and build image
        working-directory: shendu
        run: |
          cp .env.example .env
          sed -i "s/replace_with_64_hex_characters/$(openssl rand -hex 32)/" .env
          docker compose config >/dev/null
          docker compose config --format json | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { services } = JSON.parse(readFileSync(0, "utf8"));
            if (Object.keys(services.caddy.environment).some(key => key !== "SHENDU_DOMAIN")) throw new Error("Caddy must receive only its domain, never application secrets");
            if (services.shendu.environment.SHENDU_TRUST_PROXY !== "true") throw new Error("Private Compose upstream must explicitly trust Caddy");
          '
          docker build -t shendu-ci .
      - name: Start image and check health
        run: |
          docker run -d --name shendu-ci -p 127.0.0.1:43127:3000 shendu-ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43127/healthz; then
              node shendu/scripts/smoke-ui.mjs http://127.0.0.1:43127
              exit $?
            fi
            sleep 1
          done
          docker logs shendu-ci
          exit 1
      - name: Clean up smoke container
        if: always()
        run: docker rm -f shendu-ci || true
